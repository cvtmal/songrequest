doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        server_version: '17'
        persistent: true

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            # Overrides the built-in type: also accepts PostgreSQL values with microseconds.
            datetimetz_immutable: App\Shared\Doctrine\Type\FlexibleDateTimeTzImmutableType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Accounts:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Accounts/Entity'
                prefix: 'App\Accounts\Entity'
                alias: Accounts
            Events:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Events/Entity'
                prefix: 'App\Events\Entity'
                alias: Events
            Requests:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Requests/Entity'
                prefix: 'App\Requests\Entity'
                alias: Requests

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
            persistent: false

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
