security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # No `property`: UserRepository::loadUserByIdentifier() lowercases the email first.
        users:
            entity:
                class: App\Accounts\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        health:
            pattern: ^/health$
            security: false
        # Guests never log in and never get a session; guest_token is their only cookie.
        guest:
            pattern: ^/r/
            security: false
        main:
            lazy: true
            provider: users
            form_login:
                login_path: login
                check_path: login
                default_target_path: dj_home
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days, renewed on every remembered login
            # Symfony's defaults, written out: a DJ who forgot the password minutes before a gig must not wait long (owner, 2026-10-02).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: /logout
                target: login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/dj, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
